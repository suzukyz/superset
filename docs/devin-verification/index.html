<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Devin Issue Verification — Metrics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
      :root { --bg: #0b1021; --card: #161c33; --fg: #e6e9f5; --muted: #97a0c3; --accent: #20a7c9; --ok: #2fbf71; --warn: #f5a623; --bad: #e04355; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
      header { padding: 24px 32px; border-bottom: 1px solid #263056; }
      h1 { margin: 0; font-size: 20px; }
      header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
      main { padding: 24px 32px; max-width: 1100px; margin: 0 auto; }
      .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
      .card { background: var(--card); border: 1px solid #263056; border-radius: 12px; padding: 18px; }
      .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
      .kpi .value { font-size: 30px; font-weight: 700; margin-top: 6px; }
      .kpi .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
      @media (max-width: 720px) { .charts { grid-template-columns: 1fr; } }
      h2 { font-size: 14px; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
      table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
      th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #263056; }
      th { color: var(--muted); font-weight: 600; }
      a { color: var(--accent); }
      .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
      .b-reproduced { background: rgba(47,191,113,.18); color: var(--ok); }
      .b-insufficient { background: rgba(245,166,35,.18); color: var(--warn); }
      .b-not { background: rgba(224,67,85,.18); color: var(--bad); }
      .b-other { background: rgba(151,160,195,.18); color: var(--muted); }
      footer { color: var(--muted); font-size: 12px; padding: 16px 32px 40px; text-align: center; }
      #error { color: var(--bad); padding: 16px; }
    </style>
  </head>
  <body>
    <header>
      <h1>🤖 Devin Issue Verification — Solution Metrics</h1>
      <p id="meta">Loading…</p>
    </header>
    <main>
      <div id="error" hidden></div>
      <section class="kpis" id="kpis"></section>
      <section class="charts">
        <div class="card"><h2>Verdict distribution</h2><canvas id="verdictChart"></canvas></div>
        <div class="card"><h2>Runtime &amp; ACU per verification</h2><canvas id="runtimeChart"></canvas></div>
      </section>
      <div class="card" style="margin-top:20px">
        <h2>Verification log</h2>
        <table id="log"><thead><tr>
          <th>Issue</th><th>Verdict</th><th>Runtime</th><th>ACUs</th><th>Human decision</th><th>When</th><th>Report</th>
        </tr></thead><tbody></tbody></table>
      </div>
    </main>
    <footer>Data source: GitHub issues (verification report comment markers). Regenerated by the <code>Devin Verification Metrics</code> workflow.</footer>
    <script>
      const fmtPct = (v) => (v === null || v === undefined ? "n/a" : (v * 100).toFixed(0) + "%");
      const verdictClass = (v) => {
        v = (v || "").toLowerCase();
        if (v === "reproduced") return "b-reproduced";
        if (v === "insufficient info") return "b-insufficient";
        if (v === "not reproduced") return "b-not";
        return "b-other";
      };
      function kpi(label, value, sub) {
        return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub || ""}</div></div>`;
      }
      async function main() {
        let doc;
        try {
          const res = await fetch("./verifications.json", { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          doc = await res.json();
        } catch (e) {
          const el = document.getElementById("error");
          el.hidden = false;
          el.textContent = "Failed to load verifications.json: " + e.message;
          return;
        }
        const s = doc.summary;
        document.getElementById("meta").textContent =
          `${doc.repo} · generated ${new Date(doc.generated_at).toLocaleString()} · ${s.total_verifications} verifications`;
        document.getElementById("kpis").innerHTML = [
          kpi("Total verifications", s.total_verifications, ""),
          kpi("Reproduce rate", fmtPct(s.reproduce_rate), "of verifiable issues"),
          kpi("Human approval rate", fmtPct(s.human_approval_rate), `${s.human_decisions.approved} approved / ${s.human_decisions.rejected} rejected / ${s.human_decisions.pending} pending`),
          kpi("Avg runtime", s.runtime_min.avg + "m", `p90 ${s.runtime_min.p90}m`),
          kpi("Total ACUs", s.acus.total, `avg ${s.acus.avg}/issue`),
          kpi("Est. cost", "$" + s.acus.est_cost_usd, `@ $${s.acus.usd_per_acu}/ACU`),
        ].join("");

        const vc = s.verdict_counts || {};
        new Chart(document.getElementById("verdictChart"), {
          type: "doughnut",
          data: { labels: Object.keys(vc), datasets: [{ data: Object.values(vc),
            backgroundColor: ["#2fbf71", "#f5a623", "#e04355", "#20a7c9", "#97a0c3"] }] },
          options: { plugins: { legend: { labels: { color: "#e6e9f5" } } } },
        });

        const recs = doc.records || [];
        new Chart(document.getElementById("runtimeChart"), {
          type: "bar",
          data: {
            labels: recs.map((r) => "#" + r.issue),
            datasets: [
              { label: "Runtime (min)", data: recs.map((r) => r.runtime_min ?? 0), backgroundColor: "#20a7c9" },
              { label: "ACUs", data: recs.map((r) => r.acus ?? 0), backgroundColor: "#f5a623" },
            ],
          },
          options: { scales: { x: { ticks: { color: "#97a0c3" } }, y: { ticks: { color: "#97a0c3" } } },
            plugins: { legend: { labels: { color: "#e6e9f5" } } } },
        });

        const tbody = document.querySelector("#log tbody");
        tbody.innerHTML = recs.map((r) => `<tr>
          <td>#${r.issue}</td>
          <td><span class="badge ${verdictClass(r.verdict)}">${r.verdict || "?"}</span></td>
          <td>${r.runtime_min ?? "–"}${r.runtime_min != null ? "m" : ""}</td>
          <td>${r.acus ?? "–"}</td>
          <td>${r.human_decision || "pending"}</td>
          <td>${r.created_at ? new Date(r.created_at).toLocaleDateString() : "–"}</td>
          <td>${r.comment_url ? `<a href="${r.comment_url}">view</a>` : "–"}</td>
        </tr>`).join("");
      }
      main();
    </script>
  </body>
</html>
