name: Devin Verification Metrics

on:
  # Refresh when a verification report is (likely) posted or labels change.
  issues:
    types: [labeled, unlabeled, closed]
  issue_comment:
    types: [created, edited]
  # Nightly refresh to pick up human approve/reject decisions.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Only one deploy at a time; let the latest win.
concurrency:
  group: devin-metrics-pages
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Aggregate verification metrics from issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p _site
          cp docs/devin-verification/index.html _site/index.html
          python scripts/devin_verification_metrics/aggregate.py _site/verifications.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
